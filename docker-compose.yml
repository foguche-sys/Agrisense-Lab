services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: agrisense
      POSTGRES_USER: agrisense
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U agrisense"], interval: 5s, retries: 10 }
    restart: unless-stopped
  web:
    build: .
    env_file: .env
    depends_on: { db: { condition: service_healthy } }
    ports: ["8000:8000"]
    restart: unless-stopped
  housekeeping:
    build: .
    env_file: .env
    depends_on: { db: { condition: service_healthy } }
    command: sh -c "while true; do flask --app wsgi housekeeping; sleep 300; done"
    restart: unless-stopped
volumes:
  pgdata:
